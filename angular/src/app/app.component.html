<app-actor-form></app-actor-form>

<div>
	@for (message of messages; track $index) {
		<div>Message {{message}}</div>
	}
</div>

<div>
	<form #messageForm="ngForm" (ngSubmit)="addMessage()">
		<input type="text" [(ngModel)]="newMessage" #messageCtrl="ngModel" id="newMessage" name="newMessage"/>
		<button>Add Message</button>
		<button (click)="clearMessages()">Clear Messages</button>
	</form>
</div>
